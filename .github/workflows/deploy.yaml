---
on: 
  push:
    branches:
    - init
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: cachix/install-nix-action@v31
    - run: nix build
    - id: deployment
      uses: actions/upload-pages-artifact@v4
      with:
        path: result/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
